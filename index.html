<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPTKQuiz — University Examination Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arima:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Arima', system-ui, sans-serif;
      background: #0d0d0d;
      color: #ececec;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(99,102,241,0.13) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(168,85,247,0.10) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .auth-card {
      position: relative;
      z-index: 1;
      background: #111;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 48px 44px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 28px 80px rgba(0,0,0,0.65);
      animation: cardIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg,#6366f1,#a855f7);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .brand-name { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    .auth-title { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 6px; letter-spacing: -0.5px; }
    .auth-sub   { font-size: 14px; color: #888; margin-bottom: 28px; }
    .tab-row {
      display: flex;
      background: #1a1a1a;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 26px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1; padding: 9px;
      border: none; border-radius: 8px;
      cursor: pointer;
      font-family: 'Arima', sans-serif;
      font-size: 14px; font-weight: 600;
      transition: all 0.18s;
      background: transparent; color: #888;
    }
    .tab-btn.active { background: #222; color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.45); }
    .google-btn {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 13px 20px;
      background: #fff; color: #1a1a1a;
      border: none; border-radius: 10px;
      font-family: 'Arima', sans-serif;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      margin-bottom: 22px;
    }
    .google-btn:hover { background: #f1f1f1; box-shadow: 0 4px 18px rgba(0,0,0,0.4); transform: translateY(-1px); }
    .google-btn:active { transform: translateY(0); }
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 22px; color: #444; font-size: 13px;
    }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:#222; }
    .input-group { margin-bottom: 14px; }
    .input-label { display:block; font-size:13px; font-weight:600; color:#aaa; margin-bottom:7px; }
    .input-field {
      width: 100%; padding: 12px 14px;
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 10px; color: #fff;
      font-family: 'Arima', sans-serif; font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .input-field::placeholder { color: #555; }
    .password-wrap { position: relative; }
    .eye-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 16px; color: #666;
      font-family: 'Arima', sans-serif;
    }
    .pw-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
    .forgot { font-size:13px; color:#6366f1; cursor:pointer; background:none; border:none; font-family:'Arima',sans-serif; }
    .forgot:hover { text-decoration:underline; }
    .primary-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg,#6366f1,#a855f7);
      color: #fff; border: none; border-radius: 10px;
      font-family: 'Arima', sans-serif; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 6px;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(99,102,241,0.35);
    }
    .primary-btn:hover { opacity:0.92; transform:translateY(-1px); box-shadow:0 6px 26px rgba(99,102,241,0.45); }
    .primary-btn:active { transform:translateY(0); }
    .primary-btn:disabled { opacity:0.45; cursor:not-allowed; transform:none; }
    .footer-note { text-align:center; font-size:12px; color:#555; margin-top:18px; line-height:1.7; }
    .footer-note a { color:#6366f1; text-decoration:none; }
    .footer-note a:hover { text-decoration:underline; }
    .alert { padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
    .alert-error   { background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.3); color:#f87171; }
    .alert-success { background:rgba(34,197,94,0.10); border:1px solid rgba(34,197,94,0.25); color:#4ade80; }
    .welcome-avatar {
      width:68px; height:68px; border-radius:50%; object-fit:cover;
      border:3px solid #6366f1; display:block; margin:0 auto 14px;
    }
    .welcome-avatar-ph {
      width:68px; height:68px; border-radius:50%;
      background:linear-gradient(135deg,#6366f1,#a855f7);
      display:flex; align-items:center; justify-content:center;
      font-size:30px; margin:0 auto 14px;
      border:3px solid rgba(99,102,241,0.4);
    }
    .welcome-name  { text-align:center; font-size:20px; font-weight:700; color:#fff; margin-bottom:4px; }
    .welcome-email { text-align:center; font-size:13px; color:#888; margin-bottom:22px; }
    .role-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
    .role-card {
      padding:18px 12px; background:#1a1a1a;
      border:2px solid #2a2a2a; border-radius:12px;
      cursor:pointer; text-align:center;
      transition:border-color 0.2s, background 0.2s;
    }
    .role-card:hover { border-color:#6366f1; background:rgba(99,102,241,0.06); }
    .role-card.selected { border-color:#6366f1; background:rgba(99,102,241,0.12); }
    .role-icon { font-size:28px; margin-bottom:6px; }
    .role-label { font-size:14px; font-weight:600; color:#ddd; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .spinner {
      width:18px; height:18px;
      border:2px solid rgba(255,255,255,0.3);
      border-top-color:#fff; border-radius:50%;
      animation:spin 0.7s linear infinite;
      display:inline-block;
    }
    .logout-btn {
      background:transparent; border:1px solid #2a2a2a;
      border-radius:8px; color:#888; padding:6px 14px;
      cursor:pointer; font-family:'Arima',sans-serif; font-size:13px;
    }
    .logout-btn:hover { border-color:#444; color:#ccc; }
    .info-box {
      background:#1a1a1a; border:1px solid #2a2a2a;
      border-radius:12px; padding:16px 20px; margin-top:18px;
    }
    .info-key { font-size:12px; color:#666; margin-bottom:5px; }
    .info-val { font-size:16px; font-weight:700; color:#fff; letter-spacing:1px; }
    .info-sub { font-size:13px; color:#888; margin-top:3px; }
    .dash-box {
      margin-top:14px; padding:14px 20px;
      border-radius:12px; font-size:14px; color:#aaa; text-align:center;
    }
    @media(max-width:480px) { .auth-card { padding:36px 22px; margin:16px; } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

/* ── Config ── */
const GOOGLE_CLIENT_ID = '1003665987587-9m9cj96gpkf1o9qcekq8amdq6t7dimpp.apps.googleusercontent.com';
const REDIRECT_URI     = window.location.origin + window.location.pathname;
const DB_STUDENTS      = 'gptkquiz_students';
const DB_TEACHERS      = 'gptkquiz_teachers';

/* ── Helpers ── */
function parseJwt(token) {
  try { return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }
  catch { return null; }
}
function saveUser(store, user) {
  const list = JSON.parse(localStorage.getItem(store)||'[]');
  const i = list.findIndex(u=>u.email===user.email);
  if(i>=0) list[i]={...list[i],...user}; else list.push(user);
  localStorage.setItem(store, JSON.stringify(list));
}
function findUser(store, key, val) {
  return (JSON.parse(localStorage.getItem(store)||'[]')).find(u=>u[key]===val)||null;
}
function googleURL() {
  return 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({
    client_id:     GOOGLE_CLIENT_ID,
    redirect_uri:  REDIRECT_URI,
    response_type: 'token id_token',
    scope:         'openid email profile',
    prompt:        'select_account',
    nonce:         Math.random().toString(36).slice(2),
  });
}

/* ── Google SVG ── */
function GIcon() {
  return (
    <svg width="20" height="20" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.8 2.5 30.3 0 24 0 14.7 0 6.7 5.4 2.8 13.3l7.8 6.1C12.6 13 17.9 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17z"/>
      <path fill="#FBBC05" d="M10.6 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.8-6.1A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.5 10.7l8.1-6.1z"/>
      <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.1 0-11.4-4.1-13.3-9.7l-8.1 6.1C6.7 42.6 14.7 48 24 48z"/>
    </svg>
  );
}

/* ── Google Button ── */
function GoogleBtn({ label }) {
  return (
    <button className="google-btn" onClick={() => window.location.href = googleURL()}>
      <GIcon /> {label}
    </button>
  );
}

/* ── Choose Role (after Google redirect) ── */
function ChooseRole({ gUser, onChosen }) {
  const [role, setRole] = useState(null);
  const [loading, setLoading] = useState(false);
  return (
    <div className="auth-card">
      <div className="brand">
        <div className="brand-icon">🎓</div>
        <span className="brand-name">GPTKQuiz</span>
      </div>
      {gUser.picture
        ? <img src={gUser.picture} className="welcome-avatar" alt="" />
        : <div className="welcome-avatar-ph">👤</div>}
      <div className="welcome-name">Hi, {gUser.given_name || gUser.name}!</div>
      <div className="welcome-email">{gUser.email}</div>
      <p style={{fontSize:14,color:'#888',textAlign:'center',marginBottom:16}}>How are you using GPTKQuiz?</p>
      <div className="role-grid">
        <div className={`role-card${role==='student'?' selected':''}`} onClick={()=>setRole('student')}>
          <div className="role-icon">🧑‍🎓</div>
          <div className="role-label">Student</div>
        </div>
        <div className={`role-card${role==='teacher'?' selected':''}`} onClick={()=>setRole('teacher')}>
          <div className="role-icon">🧑‍🏫</div>
          <div className="role-label">Teacher</div>
        </div>
      </div>
      <button className="primary-btn" disabled={!role||loading}
        onClick={()=>{setLoading(true);setTimeout(()=>onChosen(role),500);}}>
        {loading?<span className="spinner"/>:'Continue →'}
      </button>
    </div>
  );
}

/* ── Student Registration (after Google) ── */
function StudentReg({ gUser, onDone }) {
  const [rollNo, setRoll] = useState('');
  const [err, setErr] = useState('');
  const [loading, setL] = useState(false);
  const submit = () => {
    if(!rollNo.trim()){setErr('Enter your Register / Roll Number.');return;}
    setL(true);
    const u = { name:gUser.name, email:gUser.email, picture:gUser.picture||'',
                googleId:gUser.sub, rollNo:rollNo.trim().toUpperCase(), role:'student',
                createdAt:new Date().toISOString() };
    saveUser(DB_STUDENTS,u);
    setTimeout(()=>onDone(u),600);
  };
  return (
    <div className="auth-card">
      <div className="brand"><div className="brand-icon">🎓</div><span className="brand-name">GPTKQuiz</span></div>
      <div className="auth-title">Almost there!</div>
      <div className="auth-sub">Link your roll number to complete sign-up.</div>
      {err && <div className="alert alert-error">⚠ {err}</div>}
      <div className="input-group">
        <label className="input-label">Full Name</label>
        <input className="input-field" value={gUser.name} readOnly style={{opacity:0.55}} />
      </div>
      <div className="input-group">
        <label className="input-label">Register No. / Roll No.</label>
        <input className="input-field" placeholder="e.g. 2026CS101" value={rollNo}
          autoFocus
          onChange={e=>{setRoll(e.target.value);setErr('');}}
          onKeyDown={e=>e.key==='Enter'&&submit()} />
      </div>
      <div className="input-group">
        <label className="input-label">Email (from Google)</label>
        <input className="input-field" value={gUser.email} readOnly style={{opacity:0.55}} />
      </div>
      <button className="primary-btn" onClick={submit} disabled={loading}>
        {loading?<span className="spinner"/>:'Complete Registration'}
      </button>
      <p className="footer-note">By continuing you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy</a>.</p>
    </div>
  );
}

/* ── Teacher Registration (after Google) ── */
function TeacherReg({ gUser, onDone }) {
  const [empId, setEmp] = useState('');
  const [dept, setDept] = useState('');
  const [err, setErr]   = useState('');
  const [loading, setL] = useState(false);
  const submit = () => {
    if(!empId.trim()){setErr('Enter your Employee / Staff ID.');return;}
    setL(true);
    const u = { name:gUser.name, email:gUser.email, picture:gUser.picture||'',
                googleId:gUser.sub, empId:empId.trim().toUpperCase(), dept:dept.trim(),
                role:'teacher', createdAt:new Date().toISOString() };
    saveUser(DB_TEACHERS,u);
    setTimeout(()=>onDone(u),600);
  };
  return (
    <div className="auth-card">
      <div className="brand"><div className="brand-icon">🎓</div><span className="brand-name">GPTKQuiz</span></div>
      <div className="auth-title">Faculty Setup</div>
      <div className="auth-sub">Enter your staff details to continue.</div>
      {err && <div className="alert alert-error">⚠ {err}</div>}
      <div className="input-group">
        <label className="input-label">Full Name</label>
        <input className="input-field" value={gUser.name} readOnly style={{opacity:0.55}} />
      </div>
      <div className="input-group">
        <label className="input-label">Employee / Staff ID</label>
        <input className="input-field" placeholder="e.g. FAC2026001" value={empId}
          autoFocus
          onChange={e=>{setEmp(e.target.value);setErr('');}}
          onKeyDown={e=>e.key==='Enter'&&submit()} />
      </div>
      <div className="input-group">
        <label className="input-label">Department <span style={{color:'#555'}}>(optional)</span></label>
        <input className="input-field" placeholder="e.g. Computer Science" value={dept}
          onChange={e=>setDept(e.target.value)} />
      </div>
      <button className="primary-btn" onClick={submit} disabled={loading}>
        {loading?<span className="spinner"/>:'Complete Setup'}
      </button>
      <p className="footer-note">By continuing you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy</a>.</p>
    </div>
  );
}

/* ── Welcome Dashboard ── */
function Welcome({ user, onLogout }) {
  const isT = user.role === 'teacher';
  return (
    <div className="auth-card" style={{maxWidth:440}}>
      <div className="brand" style={{justifyContent:'space-between'}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div className="brand-icon">🎓</div>
          <span className="brand-name">GPTKQuiz</span>
        </div>
        <button className="logout-btn" onClick={onLogout}>Log out</button>
      </div>
      {user.picture
        ? <img src={user.picture} className="welcome-avatar" alt="" />
        : <div className="welcome-avatar-ph">{isT?'🧑‍🏫':'🧑‍🎓'}</div>}
      <div className="welcome-name">{user.name}</div>
      <div className="welcome-email">{user.email}</div>
      <div className="info-box">
        <div className="info-key">{isT ? 'Staff ID' : 'Roll Number'}</div>
        <div className="info-val">{isT ? user.empId : user.rollNo}</div>
        {isT && user.dept && <div className="info-sub">{user.dept}</div>}
      </div>
      <div className="dash-box" style={{
        background: isT ? 'rgba(168,85,247,0.07)' : 'rgba(99,102,241,0.07)',
        border: `1px solid ${isT?'rgba(168,85,247,0.2)':'rgba(99,102,241,0.2)'}`,
      }}>
        {isT ? '🧑‍🏫 Teacher Dashboard — coming soon' : '🧑‍🎓 Student Exam Portal — coming soon'}
      </div>
    </div>
  );
}

/* ── Login Screen ── */
function LoginScreen({ onSwitch, onLoggedIn }) {
  const [tab, setTab]   = useState('student');
  const [id, setId]     = useState('');
  const [pw, setPw]     = useState('');
  const [show, setShow] = useState(false);
  const [err, setErr]   = useState('');
  const [loading, setL] = useState(false);

  const login = () => {
    setErr('');
    if(!id.trim()||!pw.trim()){setErr('Please fill in all fields.');return;}
    setL(true);
    setTimeout(()=>{
      if(tab==='student'){
        const s = findUser(DB_STUDENTS,'rollNo',id.trim().toUpperCase())
               || findUser(DB_STUDENTS,'email',id.trim());
        if(s&&s.googleId){setErr('This account uses Google. Click "Continue with Google" above.');setL(false);return;}
        const demo = (id==='student'&&pw==='student123')||(id.toUpperCase()==='2026CS101'&&pw==='student123');
        if(demo){onLoggedIn({name:'Demo Student',email:'demo@student.edu',rollNo:id.toUpperCase(),role:'student',picture:''});return;}
        if(s&&s.password===pw){onLoggedIn(s);return;}
        setErr('Incorrect credentials. Try again or use Google Sign-In.');setL(false);
      } else {
        const t = findUser(DB_TEACHERS,'empId',id.trim().toUpperCase())
               || findUser(DB_TEACHERS,'email',id.trim());
        if(t&&t.googleId){setErr('This account uses Google. Click "Continue with Google" above.');setL(false);return;}
        if(id==='admin@faculty.edu'&&pw==='CSE@2026'){onLoggedIn({name:'Admin Faculty',email:'admin@faculty.edu',empId:'ADMIN001',role:'teacher',picture:''});return;}
        if(t&&t.password===pw){onLoggedIn(t);return;}
        setErr('Incorrect credentials. Try again or use Google Sign-In.');setL(false);
      }
    },700);
  };

  return (
    <div className="auth-card">
      <div className="brand"><div className="brand-icon">🎓</div><span className="brand-name">GPTKQuiz</span></div>
      <div className="auth-title">Welcome back</div>
      <div className="auth-sub">Sign in to your portal account.</div>
      <div className="tab-row">
        <button className={`tab-btn${tab==='student'?' active':''}`} onClick={()=>{setTab('student');setErr('');}}>Student</button>
        <button className={`tab-btn${tab==='teacher'?' active':''}`} onClick={()=>{setTab('teacher');setErr('');}}>Teacher</button>
      </div>
      <GoogleBtn label="Continue with Google" />
      <div className="divider">or</div>
      {err && <div className="alert alert-error">⚠ {err}</div>}
      <div className="input-group">
        <label className="input-label">{tab==='student'?'Roll No. or Email':'Staff ID or Email'}</label>
        <input className="input-field" autoFocus
          placeholder={tab==='student'?'e.g. 2026CS101':'e.g. FAC2026001'}
          value={id} onChange={e=>{setId(e.target.value);setErr('');}}
          onKeyDown={e=>e.key==='Enter'&&login()} />
      </div>
      <div className="input-group">
        <div className="pw-row">
          <label className="input-label" style={{margin:0}}>Password</label>
          <button className="forgot">Forgot password?</button>
        </div>
        <div className="password-wrap">
          <input className="input-field" type={show?'text':'password'}
            placeholder="Enter password" value={pw}
            onChange={e=>{setPw(e.target.value);setErr('');}}
            onKeyDown={e=>e.key==='Enter'&&login()}
            style={{paddingRight:44}} />
          <button className="eye-btn" onClick={()=>setShow(s=>!s)}>{show?'🙈':'👁'}</button>
        </div>
      </div>
      <button className="primary-btn" onClick={login} disabled={loading}>
        {loading?<span className="spinner"/>:'Sign In'}
      </button>
      <p className="footer-note" style={{marginTop:16}}>
        No account? <a href="#" onClick={e=>{e.preventDefault();onSwitch('signup');}}>Create one</a>
      </p>
    </div>
  );
}

/* ── Sign Up Screen ── */
function SignupScreen({ onSwitch }) {
  const [tab, setTab]     = useState('student');
  const [name, setName]   = useState('');
  const [uid, setUid]     = useState('');
  const [email, setEmail] = useState('');
  const [pw, setPw]       = useState('');
  const [show, setShow]   = useState(false);
  const [err, setErr]     = useState('');
  const [ok, setOk]       = useState('');
  const [loading, setL]   = useState(false);

  const submit = () => {
    setErr('');setOk('');
    if(!name.trim()||!uid.trim()||!email.trim()||!pw.trim()){setErr('All fields required.');return;}
    if(pw.length<6){setErr('Password must be at least 6 characters.');return;}
    setL(true);
    setTimeout(()=>{
      if(tab==='student'){
        const exists = findUser(DB_STUDENTS,'rollNo',uid.trim().toUpperCase())||findUser(DB_STUDENTS,'email',email.trim());
        if(exists){setErr('Account already exists. Sign in instead.');setL(false);return;}
        saveUser(DB_STUDENTS,{name:name.trim(),email:email.trim(),rollNo:uid.trim().toUpperCase(),password:pw,role:'student',createdAt:new Date().toISOString()});
      } else {
        const exists = findUser(DB_TEACHERS,'empId',uid.trim().toUpperCase())||findUser(DB_TEACHERS,'email',email.trim());
        if(exists){setErr('Account already exists. Sign in instead.');setL(false);return;}
        saveUser(DB_TEACHERS,{name:name.trim(),email:email.trim(),empId:uid.trim().toUpperCase(),password:pw,role:'teacher',createdAt:new Date().toISOString()});
      }
      setOk('Account created! Redirecting to sign in…');setL(false);
      setTimeout(()=>onSwitch('login'),1500);
    },800);
  };

  return (
    <div className="auth-card">
      <div className="brand"><div className="brand-icon">🎓</div><span className="brand-name">GPTKQuiz</span></div>
      <div className="auth-title">Create account</div>
      <div className="auth-sub">Join GPTKQuiz today.</div>
      <div className="tab-row">
        <button className={`tab-btn${tab==='student'?' active':''}`} onClick={()=>{setTab('student');setErr('');}}>Student</button>
        <button className={`tab-btn${tab==='teacher'?' active':''}`} onClick={()=>{setTab('teacher');setErr('');}}>Teacher</button>
      </div>
      <GoogleBtn label="Sign up with Google" />
      <div className="divider">or sign up with email</div>
      {err && <div className="alert alert-error">⚠ {err}</div>}
      {ok  && <div className="alert alert-success">✅ {ok}</div>}
      <div className="input-group">
        <label className="input-label">Full Name</label>
        <input className="input-field" placeholder="Your full name" value={name} autoFocus
          onChange={e=>{setName(e.target.value);setErr('');}} />
      </div>
      <div className="input-group">
        <label className="input-label">{tab==='student'?'Register No. / Roll No.':'Employee / Staff ID'}</label>
        <input className="input-field" placeholder={tab==='student'?'e.g. 2026CS101':'e.g. FAC2026001'}
          value={uid} onChange={e=>{setUid(e.target.value);setErr('');}} />
      </div>
      <div className="input-group">
        <label className="input-label">Email Address</label>
        <input className="input-field" type="email" placeholder="you@example.com" value={email}
          onChange={e=>{setEmail(e.target.value);setErr('');}} />
      </div>
      <div className="input-group">
        <label className="input-label">Password</label>
        <div className="password-wrap">
          <input className="input-field" type={show?'text':'password'} placeholder="Min 6 characters"
            value={pw} onChange={e=>{setPw(e.target.value);setErr('');}}
            onKeyDown={e=>e.key==='Enter'&&submit()} style={{paddingRight:44}} />
          <button className="eye-btn" onClick={()=>setShow(s=>!s)}>{show?'🙈':'👁'}</button>
        </div>
      </div>
      <button className="primary-btn" onClick={submit} disabled={loading}>
        {loading?<span className="spinner"/>:'Create Account'}
      </button>
      <p className="footer-note" style={{marginTop:16}}>
        Already have an account? <a href="#" onClick={e=>{e.preventDefault();onSwitch('login');}}>Sign in</a>
      </p>
      <p className="footer-note" style={{marginTop:6}}>
        By creating an account you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a>.
      </p>
    </div>
  );
}

/* ── ROOT APP ── */
function App() {
  const [screen, setScreen] = useState('login');
  const [gUser, setGUser]   = useState(null);
  const [user, setUser]     = useState(null);

  /* Handle Google OAuth redirect — token comes back in URL hash */
  useEffect(() => {
    const hash = window.location.hash;
    if(!hash) return;
    const p = new URLSearchParams(hash.slice(1));
    const idToken = p.get('id_token');
    if(!idToken) return;
    const payload = parseJwt(idToken);
    if(!payload) return;
    history.replaceState(null,'',window.location.pathname);
    const g = { sub:payload.sub, name:payload.name, given_name:payload.given_name,
                email:payload.email, picture:payload.picture };
    // Already registered?
    const s = findUser(DB_STUDENTS,'googleId',g.sub)||findUser(DB_STUDENTS,'email',g.email);
    const t = findUser(DB_TEACHERS,'googleId',g.sub)||findUser(DB_TEACHERS,'email',g.email);
    if(s){setUser(s);setScreen('welcome');return;}
    if(t){setUser(t);setScreen('welcome');return;}
    // New user — pick role
    setGUser(g);
    setScreen('chooseRole');
  },[]);

  if(screen==='welcome'&&user)
    return <Welcome user={user} onLogout={()=>{setUser(null);setScreen('login');}}/>;
  if(screen==='chooseRole'&&gUser)
    return <ChooseRole gUser={gUser} onChosen={r=>setScreen(r==='student'?'studentReg':'teacherReg')}/>;
  if(screen==='studentReg'&&gUser)
    return <StudentReg gUser={gUser} onDone={u=>{setUser(u);setScreen('welcome');}}/>;
  if(screen==='teacherReg'&&gUser)
    return <TeacherReg gUser={gUser} onDone={u=>{setUser(u);setScreen('welcome');}}/>;
  if(screen==='signup')
    return <SignupScreen onSwitch={setScreen}/>;
  return <LoginScreen onSwitch={setScreen} onLoggedIn={u=>{setUser(u);setScreen('welcome');}}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
