<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Portal | Login</title>

  <!-- Font Links (Arima - GPTK Quiz Design System) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arima:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Arima"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            arima: ['"Arima"', 'cursive', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Identity Services (OAuth 2.0 / GIS) SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Arima:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after,
    html, body,
    input, button, select, textarea,
    span, p, h1, h2, h3, h4, h5, h6, a, label, div,
    input::placeholder, textarea::placeholder {
      font-family: 'Arima', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Arima', cursive, sans-serif !important;
      font-weight: 700 !important;
    }

    body {
      background-color: #060B18;
      color: #FFFFFF;
      overflow-x: hidden;
    }

    @keyframes gridDrift {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }
    .motion-grid {
      background-image:
        linear-gradient(to right,  rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridDrift 20s linear infinite;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0)    scale(1); }
      50%       { transform: translateY(-18px) scale(1.04); }
    }
    .orb-a { animation: floatSlow 8s  ease-in-out infinite; }
    .orb-b { animation: floatSlow 12s ease-in-out infinite reverse; }
    .orb-c { animation: floatSlow 10s ease-in-out infinite 3s; }

    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fadeIn {
      animation: fadeInSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .animate-slide-right {
      animation: slideInRight 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .animate-slide-left {
      animation: slideInLeft 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Florin Pop Double-Slider Animation System (Exact match with C:/qwe/GPTK-QUIZ) */
    .slider-main-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 1024px;
      min-height: 620px;
      border-radius: 28px;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5), 0 0 35px rgba(56, 189, 248, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .form-container {
      position: absolute;
      top: 0;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sign-in-container, .sign-up-container, .overlay-container, .overlay, .overlay-panel {
      will-change: transform, opacity;
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .sign-in-container {
      left: 0;
      width: 50%;
      z-index: 2;
      opacity: 1;
      pointer-events: auto;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .slider-main-container.right-panel-active .sign-in-container {
      transform: translate3d(100%, 0, 0);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    .sign-up-container {
      left: 0;
      width: 50%;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .slider-main-container.right-panel-active .sign-up-container {
      transform: translate3d(100%, 0, 0);
      opacity: 1;
      z-index: 5;
      pointer-events: auto;
      animation: showOverlay 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes showOverlay {
      0%, 49.99% {
        opacity: 0;
        z-index: 1;
      }
      50%, 100% {
        opacity: 1;
        z-index: 5;
      }
    }

    /* Overlay Container (Sliding gradient / glass panel) */
    .overlay-container {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      overflow: hidden;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    .slider-main-container.right-panel-active .overlay-container {
      transform: translate3d(-100%, 0, 0);
      border-left: none;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .overlay {
      background: rgba(17, 24, 54, 0.85);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      color: #ffffff;
      position: relative;
      left: -100%;
      height: 100%;
      width: 200%;
      transform: translate3d(0, 0, 0);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .slider-main-container.right-panel-active .overlay {
      transform: translate3d(50%, 0, 0);
    }

    .overlay-panel {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 0;
      text-align: center;
      top: 0;
      height: 100%;
      width: 50%;
      transform: translate3d(0, 0, 0);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .overlay-left {
      transform: translateX(-20%);
    }

    .slider-main-container.right-panel-active .overlay-left {
      transform: translateX(0);
    }

    .overlay-right {
      right: 0;
      transform: translateX(0);
    }

    .slider-main-container.right-panel-active .overlay-right {
      transform: translateX(20%);
    }

    /* Tactile Interactive Button Hover System */
    button {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0px) scale(0.98) !important;
    }
  </style>
</head>
<body class="min-h-screen relative selection:bg-white selection:text-black">

  <!-- Grid Background -->
  <div class="fixed inset-0 motion-grid pointer-events-none z-0"></div>

  <!-- Ambient Orbs — luminous glow for glass refraction -->
  <div class="fixed top-1/4 left-10 w-96 h-96 bg-blue-600/20 rounded-full blur-[100px] pointer-events-none orb-a z-0"></div>
  <div class="fixed bottom-1/4 right-10 w-[420px] h-[420px] bg-purple-600/20 rounded-full blur-[120px] pointer-events-none orb-b z-0"></div>
  <div class="fixed top-10 right-1/3 w-72 h-72 bg-sky-500/15 rounded-full blur-[90px] pointer-events-none orb-c z-0"></div>

  <!-- React Root -->
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Decodes the Google Identity Services JWT credential payload
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(
          atob(base64)
            .split('')
            .map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
            .join('')
        );
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    const GoogleButton = ({ label, onClick }) => (
      <button
        type="button"
        onClick={onClick}
        style={{
          background: 'rgba(255, 255, 255, 0.05)',
          backdropFilter: 'blur(10px)',
          boxShadow: '0 4px 14px rgba(0, 0, 0, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.1)'
        }}
        className="w-full flex items-center justify-center gap-3 py-3 px-4 border border-white/10 rounded-full font-semibold text-sm text-white transition-all duration-200 hover:bg-white/15 hover:border-white/30 hover:shadow-[0_8px_22px_rgba(0,0,0,0.35),0_0_15px_rgba(255,255,255,0.1)] active:scale-[0.98]"
      >
        <svg className="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        <span>{label}</span>
      </button>
    );

    /* ════════════════════════════════════════
       Authentic Google OAuth 2-Step Authentication Modal
       (Matching user uploaded Image 1 & Image 2 + Live GIS)
    ════════════════════════════════════════ */
    const GoogleAuthModal = ({ isOpen, onClose, role, onAuthSuccess }) => {
      // step: 1 = 'choose-account', 2 = 'confirm-consent', 3 = 'redirecting'
      const [step, setStep]                     = useState(1);
      const [selectedAccount, setSelectedAccount] = useState(null);
      const [customMode, setCustomMode]         = useState(false);
      const [customName, setCustomName]         = useState('');
      const [customEmail, setCustomEmail]       = useState('');

      React.useEffect(() => {
        if (isOpen) {
          setStep(1);
          setSelectedAccount(null);
          setCustomMode(false);
        }
      }, [isOpen]);

      if (!isOpen) return null;

      const accounts = [
        { name: 'Vasudevan', email: 'vsvasudevanvasu02@gmail.com', initial: 'V', color: 'bg-[#8E24AA]' },
        { name: 'Vasudevan', email: 'vasudevanvasuvs02@gmail.com', initial: 'V', color: 'bg-[#9C27B0]' }
      ];

      const handleAccountClick = (acc) => {
        setSelectedAccount(acc);
        setStep(2); // Go to Step 2: Consent / Permission screen (Image 2)
      };

      const handleCustomSubmit = (e) => {
        e.preventDefault();
        if (!customName.trim() || !customEmail.trim()) return;
        const acc = {
          name: customName.trim(),
          email: customEmail.trim(),
          initial: customName.trim().charAt(0).toUpperCase(),
          color: 'bg-[#8E24AA]'
        };
        setSelectedAccount(acc);
        setStep(2);
      };

      const handleConfirmContinue = () => {
        setStep(3); // Loading / Redirecting
        setTimeout(() => {
          onAuthSuccess({
            name: selectedAccount.name,
            email: selectedAccount.email,
            role: role
          });
        }, 700);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/80 backdrop-blur-md animate-fadeIn">
          {/* Main Google Dark Window */}
          <div 
            style={{
              background: '#131314',
              borderRadius: '28px',
              boxShadow: '0 25px 70px rgba(0, 0, 0, 0.9), 0 0 1px 1px rgba(255, 255, 255, 0.1)'
            }}
            className="w-full max-w-2xl text-white relative overflow-hidden flex flex-col justify-between min-h-[480px] p-6 sm:p-10 border border-[#303134]"
          >

            {/* Top Bar: Google Logo + Sign in with Google */}
            <div className="flex items-center justify-between pb-6 border-b border-[#282a2d]">
              <div className="flex items-center gap-2.5">
                <svg className="w-5 h-5" viewBox="0 0 24 24">
                  <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                  <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                  <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                  <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                </svg>
                <span className="text-sm font-medium text-[#e3e3e3]">Sign in with Google</span>
              </div>

              <button 
                type="button" 
                onClick={onClose}
                className="text-[#9aa0a6] hover:text-white p-1 rounded-full hover:bg-white/10 transition-colors"
                title="Close"
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            {/* STEP 1: CHOOSE AN ACCOUNT (Exact Image 1 layout) */}
            {step === 1 && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-8 py-6 flex-1 items-start">
                {/* Left Column: App icon & Title */}
                <div className="space-y-4">
                  <div className="w-12 h-12 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center shadow-md">
                    <svg className="w-7 h-7 text-sky-400" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                    </svg>
                  </div>
                  <div>
                    <h2 className="text-3xl sm:text-4xl font-normal text-[#e3e3e3] leading-tight">
                      Choose an account
                    </h2>
                    <p className="text-base text-[#c4c7c5] mt-2">
                      to continue to <span className="text-white font-medium">University Portal</span>
                    </p>
                  </div>
                </div>

                {/* Right Column: Account list */}
                <div className="space-y-1">
                  {customMode ? (
                    <form onSubmit={handleCustomSubmit} className="space-y-3 p-3 bg-[#1e1f20] rounded-xl border border-[#3c4043]">
                      <div className="text-xs font-semibold text-sky-400 uppercase tracking-wide">Enter Google Account</div>
                      <input
                        type="text"
                        required
                        placeholder="Full Name (e.g. Vasudevan)"
                        value={customName}
                        onChange={(e) => setCustomName(e.target.value)}
                        className="w-full py-2.5 px-3 bg-[#131314] border border-[#5f6368] rounded-lg text-sm text-white focus:outline-none focus:border-sky-400"
                      />
                      <input
                        type="email"
                        required
                        placeholder="Google Email (e.g. user@gmail.com)"
                        value={customEmail}
                        onChange={(e) => setCustomEmail(e.target.value)}
                        className="w-full py-2.5 px-3 bg-[#131314] border border-[#5f6368] rounded-lg text-sm text-white focus:outline-none focus:border-sky-400"
                      />
                      <div className="flex gap-2 pt-1">
                        <button
                          type="button"
                          onClick={() => setCustomMode(false)}
                          className="w-1/2 py-2 rounded-full border border-[#5f6368] text-xs text-white hover:bg-white/5"
                        >
                          Cancel
                        </button>
                        <button
                          type="submit"
                          className="w-1/2 py-2 rounded-full bg-white text-black font-semibold text-xs hover:bg-[#e3e3e3]"
                        >
                          Next
                        </button>
                      </div>
                    </form>
                  ) : (
                    <>
                      {accounts.map((acc, idx) => (
                        <button
                          key={idx}
                          type="button"
                          onClick={() => handleAccountClick(acc)}
                          className="w-full flex items-center gap-3.5 py-3.5 px-3 rounded-lg hover:bg-[#1e1f20] transition-colors text-left border-b border-[#282a2d] last:border-none"
                        >
                          <div className={`w-8 h-8 rounded-full ${acc.color} text-white font-medium text-sm flex items-center justify-center flex-shrink-0`}>
                            {acc.initial}
                          </div>
                          <div className="flex-1 min-w-0">
                            <div className="text-sm font-medium text-[#e3e3e3] leading-tight truncate">
                              {acc.name}
                            </div>
                            <div className="text-xs text-[#9aa0a6] truncate mt-0.5">
                              {acc.email}
                            </div>
                          </div>
                        </button>
                      ))}

                      {/* Use another account */}
                      <button
                        type="button"
                        onClick={() => setCustomMode(true)}
                        className="w-full flex items-center gap-3.5 py-3.5 px-3 rounded-lg hover:bg-[#1e1f20] transition-colors text-left text-[#e3e3e3]"
                      >
                        <div className="w-8 h-8 rounded-full border border-[#5f6368] flex items-center justify-center flex-shrink-0 text-[#9aa0a6]">
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                          </svg>
                        </div>
                        <span className="text-sm font-medium">Use another account</span>
                      </button>
                    </>
                  )}

                  <p className="pt-4 text-xs text-[#9aa0a6] leading-relaxed">
                    Before using this app, you can review University Portal's <a href="#" className="text-sky-400 hover:underline">Privacy Policy</a> and <a href="#" className="text-sky-400 hover:underline">Terms of Service</a>.
                  </p>
                </div>
              </div>
            )}

            {/* STEP 2: CONFIRM & AUTHORIZE ACCESS (Exact Image 2 layout) */}
            {step === 2 && selectedAccount && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-8 py-6 flex-1 items-start animate-fadeIn">
                {/* Left Column: App Title & Selected Account Pill */}
                <div className="space-y-4">
                  <div className="w-12 h-12 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center shadow-md">
                    <svg className="w-7 h-7 text-sky-400" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                    </svg>
                  </div>
                  <div>
                    <h2 className="text-3xl sm:text-4xl font-normal text-[#e3e3e3] leading-tight">
                      Sign in to University Portal
                    </h2>
                    {/* Selected Account Pill */}
                    <div className="inline-flex items-center gap-2 mt-4 px-3 py-1.5 rounded-full border border-[#3c4043] bg-[#1e1f20] text-xs text-[#e3e3e3]">
                      <div className={`w-5 h-5 rounded-full ${selectedAccount.color} text-[11px] font-bold flex items-center justify-center`}>
                        {selectedAccount.initial}
                      </div>
                      <span className="truncate max-w-[180px]">{selectedAccount.email}</span>
                      <svg className="w-3.5 h-3.5 text-[#9aa0a6]" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                      </svg>
                    </div>
                  </div>
                </div>

                {/* Right Column: Scopes / Permissions list */}
                <div className="space-y-4">
                  <h3 className="text-base font-normal text-[#e3e3e3]">
                    Google will allow University Portal to access this info about you
                  </h3>

                  {/* Scope 1: Name and profile picture */}
                  <div className="flex items-start gap-3 pt-2">
                    <div className="text-[#9aa0a6] mt-0.5">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                      </svg>
                    </div>
                    <div>
                      <div className="text-sm font-medium text-[#e3e3e3]">{selectedAccount.name}</div>
                      <div className="text-xs text-[#9aa0a6]">Name and profile picture</div>
                    </div>
                  </div>

                  {/* Scope 2: Email address */}
                  <div className="flex items-start gap-3">
                    <div className="text-[#9aa0a6] mt-0.5">
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">

            window.google.accounts.id.initialize({
              client_id: googleClientId,
              callback: (response) => {
                if (response.credential) {
                  const payload = parseJwt(response.credential);
                  if (payload) {
                    handleGoogleAuthSuccess({
                      name: payload.name || payload.email.split('@')[0],
                      email: payload.email,
                      role: registerType
                    });
                  }

              auto_select: false,
              cancel_on_tap_outside: true,

            console.warn('GIS init error:', err);

        if (googleClientId && window.google?.accounts?.id) {

              if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                // Fallback to interactive modal
                setGoogleModal({ isOpen: true, role });
              }
            });
            return;

            // Fallback
          }

        setGoogleModal({ isOpen: true, role });

              <div className="overlay">

                {/* OVERLAY LEFT: Shown when Registration mode is active */}
                <div className="overlay-panel overlay-left overflow-y-auto">
                  {registerType === 'student' ? (
                    <WelcomeBack onReturnToLogin={() => setIsRegisterMode(false)} />
                  ) : (
                    <TeacherWelcomeBack onReturnToLogin={() => setIsRegisterMode(false)} />
                  )}
                </div>

                {/* OVERLAY RIGHT: Shown by default (Teacher Portal Part) */}
                <div className="overlay-panel overlay-right overflow-y-auto">
                  <LecturerLogin 
                    onSwitchToTeacherRegister={() => {
                      setRegisterType('teacher');
                      setIsRegisterMode(true);
                    }} 
                    onGoogleAuth={handleOpenGoogle}
                    registeredIdentifier={registeredTeacherId}
                    loginNotification={teacherNotice}
                  />
                </div>

              </div>
            </div>

          </main>

          <footer className="mt-8 text-center text-xs font-medium text-gray-500 flex flex-wrap items-center justify-center gap-4">
            <span>&copy; 2026 University Network</span>
            <span>&bull;</span>
            <a href="#" className="hover:text-gray-400 transition-colors">Privacy Policy</a>
            <span>&bull;</span>
            <a href="#" className="hover:text-gray-400 transition-colors">Terms of Service</a>
            <span>&bull;</span>
            <a href="#" className="hover:text-gray-400 transition-colors">Campus IT Help</a>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
